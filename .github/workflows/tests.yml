name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the demo workflow
        run: |
          python helpdesk_lab.py init --reset
          python helpdesk_lab.py dashboard --as-of 2026-08-14T16:00:00
          python helpdesk_lab.py metrics --as-of 2026-08-14T16:00:00
          python helpdesk_lab.py report --as-of 2026-08-14T16:00:00
          python helpdesk_lab.py weekly --as-of 2026-08-14T16:00:00
      - name: Verify reproducible examples
        run: |
          python scripts/build_demo.py
          git diff --exit-code -- docs/demo-dashboard.html docs/demo-weekly-summary.md
